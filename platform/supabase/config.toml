# Supabase CLI configuration (local development: `supabase start`).
project_id = "kometa"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Accounts are created only by administrators (Edge Function admin-users).
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[functions.admin-users]
verify_jwt = true

[functions.odds-sync]
verify_jwt = false   # protected by x-cron-secret

[functions.maintenance]
verify_jwt = false   # protected by x-cron-secret

[functions.casino-provider-callback]
verify_jwt = false   # protected by HMAC signature + timestamp

[functions.admin-integrations]
verify_jwt = true

[functions.casino-launch]
verify_jwt = true
